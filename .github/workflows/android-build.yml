name: Android build

on:
  push:
    branches:
      - "**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/bakkwo-translator-debug.apk

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bakkwo-debug-apk
          path: app/build/outputs/apk/debug/bakkwo-translator-debug.apk
          if-no-files-found: error

      # actions/upload-artifact always wraps its output in a .zip, even for a single file.
      # Publishing to a rolling release instead gives a direct .apk download link.
      - name: Publish APK to rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: "바꿔 debug build"
          body: |
            자동 빌드된 최신 디버그 APK입니다. (commit ${{ github.sha }})
            이 릴리스는 push할 때마다 자동으로 갱신됩니다.
          prerelease: true
          files: app/build/outputs/apk/debug/bakkwo-translator-debug.apk
